<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="titleGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset="0.52" stop-color="#bfdbfe"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="28" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0v72" fill="none" stroke="#94a3b8" stroke-width="1" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#020617"/>
  <circle cx="90" cy="-35" r="190" fill="#06b6d4" opacity="0.16"/>
  <circle cx="1110" cy="150" r="260" fill="#8b5cf6" opacity="0.16"/>
  <circle cx="690" cy="690" r="250" fill="#2563eb" opacity="0.10"/>
  <path d="M0 0h1200v630H0z" fill="url(#grid)" opacity="0.2"/>

  <g transform="translate(36 36)">
    <rect x="0" y="0" width="405" height="38" rx="19" fill="#083344" stroke="#155e75" stroke-width="1.5"/>
    <g transform="translate(20 10)" stroke="#a5f3fc" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M9 0l2.1 5.9L17 8l-5.9 2.1L9 16l-2.1-5.9L1 8l5.9-2.1z"/>
      <path d="M19 3v6"/>
      <path d="M22 6h-6"/>
    </g>
    <text x="50" y="25" fill="#dff8ff" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="700">
      GitHub Actions security discovery
    </text>
  </g>

  <g transform="translate(36 128)" filter="url(#softShadow)">
    <text x="0" y="0" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="86" font-weight="800" letter-spacing="0">
      <tspan x="0" dy="0.95em">Repositories using</tspan>
      <tspan x="0" dy="1.18em" fill="url(#titleGradient)">pull_request_target</tspan>
    </text>
  </g>

  <text x="36" y="370" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="30" font-weight="400">
    <tspan x="36" dy="0">A static index generated from GitHub code search. Explore workflow matches,</tspan>
    <tspan x="36" dy="48">compare repositories by stars, and narrow the set by language without asking</tspan>
    <tspan x="36" dy="48">visitors for a token.</tspan>
  </text>

  <g transform="translate(36 535)">
    <rect x="0" y="0" width="250" height="60" rx="30" fill="#ffffff"/>
    <text x="28" y="38" fill="#020617" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="700">View on GitHub</text>
    <g transform="translate(206 20)" stroke="#020617" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M0 0h18v18"/>
      <path d="M0 18L18 0"/>
    </g>

    <rect x="300" y="0" width="225" height="60" rx="30" fill="#0f172a" stroke="#475569" stroke-width="1.4"/>
    <g transform="translate(335 18)" stroke="#f8fafc" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M4 13V4a2 2 0 0 1 2-2h7l7 7v11a2 2 0 0 1-2 2h-6"/>
      <path d="M13 2v7h7"/>
      <path d="M5 17l-4 4 4 4"/>
      <path d="M11 25l4-4-4-4"/>
    </g>
    <text x="380" y="38" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="500">Open JSON</text>
  </g>
