name: Generate repository index

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      scan_mode:
        description: Scan mode for scripts/generate-data.mjs
        required: true
        default: limited
        type: choice
        options:
          - limited
          - time-budget
      max_search_results:
        description: Maximum code search items for limited mode, or 1000/all for time-budget mode
        required: true
        default: '1000'
        type: string
      scan_minutes:
        description: Time budget in minutes when scan_mode is time-budget
        required: true
        default: '10'
        type: string

permissions:
  contents: write

concurrency:
  group: generate-repository-index
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      SCAN_MODE: ${{ github.event.inputs.scan_mode || 'limited' }}
      MAX_SEARCH_RESULTS: ${{ github.event.inputs.max_search_results || '1000' }}
      SCAN_MINUTES: ${{ github.event.inputs.scan_minutes || '10' }}
      SEARCH_DELAY_MS: '65000'
      RETRY_ATTEMPTS: '5'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ github.token }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate static data
        run: pnpm generate:data -- --scan-mode "$SCAN_MODE" --minutes "$SCAN_MINUTES"
      - name: Print generated data summary
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('public/data/repositories.json', 'utf8'));
          console.log(JSON.stringify({
            generatedAt: data.generatedAt,
            scanMode: data.scanMode,
            scanMinutesRequested: data.scanMinutesRequested,
            scanElapsedSeconds: data.scanElapsedSeconds,
            totalCount: data.totalCount,
            retrievedFileCount: data.retrievedFileCount,
            repositoryCount: data.repositoryCount,
            searchRequestCount: data.searchRequestCount,
            searchResultLimit: data.searchResultLimit,
            searchResultLimitReached: data.searchResultLimitReached,
            topRepository: data.repositories?.[0]?.fullName ?? null,
            openClawRepositories: data.repositories
              ?.filter((repo) => repo.fullName.toLowerCase().includes('openclaw'))
              .map((repo) => repo.fullName) ?? [],
          }, null, 2));
          NODE
      - name: Commit generated data
        run: |
          if git diff --quiet -- public/data/repositories.json; then
            echo "No repository index changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/repositories.json
          git commit -m "chore: update repository index"
          git push
