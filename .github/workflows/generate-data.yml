name: Generate repository index

on:
  schedule:
    - cron: '0 */12 * * *'
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/generate-data.yml'
      - '.github/actions/setup-nix/**'
      - 'flake.nix'
      - 'flake.lock'
  workflow_dispatch:
    inputs:
      scan_mode:
        description: Scan mode for scripts/generate-data.ts
        required: true
        default: limited
        type: choice
        options:
          - limited
          - time-budget
      max_search_results:
        description: Maximum code search items for limited mode, or 1000/all for time-budget mode
        required: true
        default: '1000'
        type: string
      scan_minutes:
        description: Time budget in minutes when scan_mode is time-budget
        required: true
        default: '10'
        type: string

permissions:
  contents: write

concurrency:
  group: generate-repository-index
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      SCAN_MODE: ${{ github.event.inputs.scan_mode || 'limited' }}
      MAX_SEARCH_RESULTS: ${{ github.event.inputs.max_search_results || '1000' }}
      SCAN_MINUTES: ${{ github.event.inputs.scan_minutes || '10' }}
      SEARCH_DELAY_MS: '65000'
      RETRY_ATTEMPTS: '5'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ github.token }}
      - uses: ./.github/actions/setup-nix
      - name: Generate static data
        run: ./scripts/generate-data.ts --scan-mode "$SCAN_MODE" --minutes "$SCAN_MINUTES"
      - name: Print generated data summary
        run: ./scripts/print-summary.ts
      - name: Commit generated data
        run: |
          if git diff --quiet -- public/data/repositories.json; then
            echo "No repository index changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/repositories.json
          git commit -m "chore: update repository index"
          git push
